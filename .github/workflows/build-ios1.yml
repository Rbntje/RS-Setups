name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle for Capacitor
        env:
          VITE_BASE_PATH: /
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Resolve Swift Package / CocoaPods if present
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          fi

      - name: Build unsigned iOS Release archive
        run: |
          mkdir -p build/ios
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/ios/RS-Setups.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive | tee build/ios/xcodebuild.log
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/ios/RS-Setups.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              archive | tee build/ios/xcodebuild.log
          fi

      - name: Package unsigned IPA
        run: bash scripts/package-unsigned-ipa.sh build/ios/RS-Setups.xcarchive build/ios/RS-Setups-unsigned.ipa

      - name: Read app version metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish direct IPA download release (ipa-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ipa-latest >/dev/null 2>&1; then
            gh release upload ipa-latest build/ios/RS-Setups-unsigned.ipa --clobber
          else
            gh release create ipa-latest build/ios/RS-Setups-unsigned.ipa \
              --title "RS Setups iOS IPA (Latest)" \
              --notes "Latest unsigned Capacitor iOS IPA built automatically from main."
          fi

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RS-Setups-v${{ steps.meta.outputs.version }}-unsigned-ipa
          path: |
            build/ios/RS-Setups-unsigned.ipa
            build/ios/xcodebuild.log
          retention-days: 30
