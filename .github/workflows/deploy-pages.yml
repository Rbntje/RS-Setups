name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --include=optional || (rm -rf node_modules package-lock.json && npm install --legacy-peer-deps --include=optional)

      - name: Run tests
        run: npm test

      - name: Build frontend for GitHub Pages subpath
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Attach latest unsigned IPA if already built
        run: |
          mkdir -p dist/downloads
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/ipa-latest/RS-Setups-unsigned.ipa" \
            -o dist/downloads/RS-Setups-unsigned.ipa || rm -f dist/downloads/RS-Setups-unsigned.ipa

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
