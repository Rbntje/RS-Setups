name: Tests & Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --include=optional || (rm -rf node_modules package-lock.json && npm install --legacy-peer-deps --include=optional)

      - name: TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build
